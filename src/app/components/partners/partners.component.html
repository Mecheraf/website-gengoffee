<div class="flex place-items-center flex-col">
  <div class="relative self-start md:self-center">
    <h2 class="font-medium text-xl md:text-2xl text-left md:text-center">{{'partners.title'|translate}}</h2>
    <app-animated-quote class="absolute z-10 -top-10 -right-24 md:-right-32 scale-[60%] md:scale-100" content="thank you!" [empty]="emptyQuote"></app-animated-quote>
  </div>
  <div class="mt-7 text-base w-full md:w-3/4 mx-auto text-left md:text-center">
    {{'partners.description'|translate}}
  </div>
  <div class="flex justify-center items-stretch gap-10 md:gap-16 mt-10 text-base">
    <div class="flex flex-col items-center justify-between">
      <a href="https://www.instagram.com/lesberthom_paris/" target="_blank">
        <img class="w-20 md:w-28" src="assets/images/berthom-logo.svg"/>
      </a>
    </div>
  </div>
  <div class="my-7">
    {{'partners.invitation'|translate}}
  </div>
  <button [routerLink]="['/contact']" class="gengoffee-btn gengoffee-btn-outline-primary bg-white mt-8 mobile-full-btn">
    {{'contact_us'|translate}}
  </button>
</div>
