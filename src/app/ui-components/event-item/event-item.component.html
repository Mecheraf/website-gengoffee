<div [ngClass]="{'opacity-50': !active}" class="box-border w-[315px] max-w-full max-h-[410px] p-3 rounded-[0.625rem] border border-solid border-[#262829] border-opacity-50">
  <div class="mx-auto flex w-full max-w-[290px] max-h-[380px] flex-col overflow-hidden rounded-[0.375rem]">
    <ng-container *ngIf="!fallback">
      <div class="h-40 w-full max-w-72 shrink-0 overflow-hidden">
        <img class="h-full w-full object-cover" [src]="'assets/images/' + getImageByCountry(event.id)" alt="" />
      </div>
      <div class="flex flex-col gap-5 px-5 py-4 {{getColorByCountry()}}">
        <div class="">
          <p class="text-sm">{{ getEventKindKey() | translate }}</p>
          <p class="text-base">{{ getEventTitle() }} <span *ngIf="getEventFlags()">{{ getEventFlags() }}</span></p>
        </div>
        <div class="w-[250px] max-w-full">
          <div class="flex items-center gap-2">
            <img src="assets/images/icons/calendar.png" alt="calendar" class="w-4 h-4" />
              <p class="text-sm">{{ getTranslatedDate() }}</p>
          </div>
          <div class="flex items-center gap-2">
              <img src="assets/images/icons/clock.png" alt="time" class="w-4 h-4" />
              <p class="text-sm">{{ getDayHour(event.location) }}</p>
          </div>
          <div class="flex items-center gap-2">
              <img src="assets/images/icons/location.png" alt="location" class="w-4 h-4" />
              <p class="text-sm">{{ event.place }}</p>
          </div>
        </div>
        <button [routerLink]="['/register']" [state]="{ id: event.id }" *ngIf="active && participateLink" class="event-item__register gengoffee-btn gengoffee-btn-secondary flex items-center justify-center">
          {{ 'register.form.register' | translate }}
        </button>
      </div>
    </ng-container>
    <ng-container *ngIf="fallback">
      <div class="flex min-h-[158px] items-center justify-center px-4 text-sm">
        {{ 'noevents' | translate }}
      </div>
    </ng-container>
  </div>
</div>
